# Additional services attached to untouched OpenEgiz platform core.
services:
  oreflow-setup:
    build:
      context: ../../team/oreflow
    image: openegiz/oreflow-northpit:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully
  oreflow:
    image: openegiz/oreflow-northpit:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 320m
    environment:
      OREFLOW_PORT: "8099"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      OREFLOW_STATE_DIR: /app/state
    volumes:
      - oreflow_state:/app/state
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:8099:8099"
    depends_on:
      oreflow-setup:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/frame',timeout=3)"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 15s
  grafana:
    volumes:
      - ../../team/oreflow/grafana_dashboard.json:/var/lib/grafana/example-dashboards/oreflow-northpit.json:ro

volumes:
  oreflow_state:
